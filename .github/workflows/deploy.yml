name: Deploy NewStarrTree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Normalize model location
        run: |
          if [ -f AxStarr.glb ]; then
            mkdir -p public/assets/models
            cp AxStarr.glb public/assets/models/AxStarr.glb
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Asset Lab
        run: npm run lab:verify

      - name: Build
        run: npm run build

      - name: Verify published entrypoints
        run: |
          test -s dist/index.html
          test -s dist/assets-lab/index.html
          test -s dist/assets/lab/seed.webp
          test -s dist/assets/lab/terrain.webp

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
