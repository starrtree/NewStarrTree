name: Deploy NewStarrTree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Normalize model location
        run: |
          if [ -f AxStarr.glb ]; then
            mkdir -p public/assets/models
            cp AxStarr.glb public/assets/models/AxStarr.glb
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Asset Lab
        run: npm run lab:verify

      - name: Build
        run: npm run build

      - name: Verify published entrypoints
        run: |
          test -s dist/index.html
          test -s dist/assets-lab/index.html
          test -s dist/assets/lab/seed.webp
          test -s dist/assets/lab/terrain.webp

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # This repo also has a legacy Pages source configured. Its automatic
      # Jekyll deployment must finish first so raw source cannot overwrite dist.
      # When Source is changed to GitHub Actions, this check returns immediately.
      - name: Wait for any legacy Pages publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs?head_sha=${process.env.GITHUB_SHA}&per_page=100`;
          for (let attempt = 0; attempt < 60; attempt++) {
            const response = await fetch(endpoint, {headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'}});
            if (!response.ok) throw new Error(`Cannot check Pages publishing: ${response.status}`);
            const {workflow_runs: runs} = await response.json();
            const pending = runs.filter(run => run.event === 'dynamic' && run.path === 'dynamic/pages/pages-build-deployment' && run.status !== 'completed');
            if (!pending.length) process.exit(0);
            console.log('Waiting for the repository branch publishing to finish before deploying the app.');
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Legacy Pages publishing has not finished; rerun this deployment after it completes.');
          NODE

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
